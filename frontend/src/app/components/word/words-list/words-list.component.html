<form [formGroup]="searchForm" class="search-form">
  <div class="search-form-filters">
    <mat-form-field class="search-form__filter">
      <mat-label>Word</mat-label>
      <input
        matInput
        (keyup)="applyFilter()"
        formControlName="wordInput"
        placeholder="Login"
        type="text"
      >
    </mat-form-field>
    <mat-form-field class="search-form__filter">
      <mat-label>Translate</mat-label>
      <input
        matInput
        (keyup)="applyFilter()"
        formControlName="translateInput"
        placeholder="Name"
        type="text"
      >
    </mat-form-field>
  </div>
  <div class="search-form-controls">
    <button
      mat-raised-button
      class="search-form__button"
      (click)="refreshData()"
    >
      <mat-icon>refresh</mat-icon>
      Refresh Data
    </button>
  </div>
</form>
<div class="mat-elevation-z8">
  <div *ngIf="isLoading" class="spinner">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
  </div>
  <div class="table" [hidden]="isLoading">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{row.id}}</td>
      </ng-container>

      <ng-container matColumnDef="word">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Word</th>
        <td mat-cell *matCellDef="let row">{{row.word}}</td>
      </ng-container>

      <ng-container matColumnDef="translate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Translate</th>
        <td mat-cell *matCellDef="let row">{{row.translate}}</td>
      </ng-container>

      <ng-container matColumnDef="ownerLogin">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>User</th>
        <td mat-cell *matCellDef="let row">{{row.ownerLogin}}</td>
      </ng-container>

      <ng-container matColumnDef="isFavorite">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Favorite</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon *ngIf="row.isFavorite">check</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="isLearned">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Learned</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon *ngIf="row.isLearned">check</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="lastUpdate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Update</th>
        <td mat-cell *matCellDef="let row">{{row.lastUpdate | date}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="openDeleteWordPopup(row.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr *matNoDataRow>
        <td class="empty-cell" colspan="4">Words not found</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="paginationOptions" aria-label="Select page of words"></mat-paginator>
  </div>
</div>
