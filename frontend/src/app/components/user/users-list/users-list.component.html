<form [formGroup]="searchForm" class="search-form">
  <div class="search-form-filters">
    <mat-form-field class="search-form__filter">
      <mat-label>Login</mat-label>
      <input
        matInput
        (keyup)="applyFilter()"
        formControlName="loginInput"
        placeholder="Login"
        type="text"
      >
    </mat-form-field>
    <mat-form-field class="search-form__filter">
      <mat-label>Name</mat-label>
      <input
        matInput
        (keyup)="applyFilter()"
        formControlName="nameInput"
        placeholder="Name"
        type="text"
      >
    </mat-form-field>
  </div>
  <div class="search-form-controls">
    <button
      mat-raised-button
      class="search-form__button"
      (click)="refreshData()"
    >
      <mat-icon>refresh</mat-icon>
      Refresh Data
    </button>
    <button
      mat-raised-button
      color="primary"
      class="search-form__button"
      (click)="openCreateUserPopup()"
    >
      <mat-icon>add</mat-icon>
      Create User
    </button>
  </div>
</form>
<div class="mat-elevation-z8">
  <div *ngIf="isLoading" class="spinner">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
  </div>
  <div class="table" [hidden]="isLoading">
    <table mat-table [dataSource]="dataSource" matSort >
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{row.id}}</td>
      </ng-container>

      <ng-container matColumnDef="login">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Login</th>
        <td mat-cell *matCellDef="let row">{{row.login}}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let row">{{row.name}}</td>
      </ng-container>

      <ng-container matColumnDef="wordsCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Words Count</th>
        <td mat-cell *matCellDef="let row">{{row.wordsCount}}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
        <td mat-cell *matCellDef="let row">{{row.createdAt | date}}</td>
      </ng-container>

      <ng-container matColumnDef="lastTestDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Test</th>
        <td mat-cell *matCellDef="let row">{{row.lastTestDate | date}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu" #menuTrigger xPosition="before">
            <button mat-menu-item (click)="openEditUserPopup(row)">
              <mat-icon>edit</mat-icon>
              <span>Edit User</span>
            </button>
            <button mat-menu-item (click)="openDeleteUserPopup(row.id)">
              <mat-icon>delete</mat-icon>
              <span>Delete User</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr *matNoDataRow>
        <td class="empty-cell" colspan="4">Users not found</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="paginationOptions" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
