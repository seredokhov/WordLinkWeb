<form [formGroup]="searchForm" class="search-form">
  <div class="search-form-filters">
    <mat-form-field class="search-form__filter">
      <mat-label>Title</mat-label>
      <input
        matInput
        (keyup)="applyFilter()"
        formControlName="titleInput"
        placeholder="Title"
        type="text"
      >
    </mat-form-field>
  </div>
  <div class="search-form-controls">
    <button
      mat-raised-button
      class="search-form__button"
      (click)="refreshData()"
    >
      <mat-icon>refresh</mat-icon>
      Refresh Data
    </button>
    <button
      mat-raised-button
      color="primary"
      class="search-form__button"
      (click)="openCreateDictionaryPopup()"
    >
      <mat-icon>add</mat-icon>
      Create Dictionary
    </button>
  </div>
</form>
<div class="mat-elevation-z8">
  <div *ngIf="isLoading" class="spinner">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
  </div>
  <div class="table" [hidden]="isLoading">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{row.id}}</td>
      </ng-container>

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
        <td mat-cell *matCellDef="let row">{{row.title}}</td>
      </ng-container>

      <ng-container matColumnDef="wordsCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Words</th>
        <td mat-cell *matCellDef="let row">{{row.wordsCount}}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
        <td mat-cell *matCellDef="let row">{{row.createdAt | date}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="openDictionaryWords(row)">
            <mat-icon>menu_book</mat-icon>
          </button>
          <button mat-icon-button (click)="openEditDictionaryPopup(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="openDeleteDictionaryPopup(row.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr *matNoDataRow>
        <td class="empty-cell" colspan="5">Dictionaries not found</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="paginationOptions" aria-label="Select page of dictionaries"></mat-paginator>
  </div>
</div>
