<div class="page-header">
  <button mat-raised-button class="page-header__button" (click)="backToDictionaries()">
    <mat-icon>arrow_back</mat-icon>
    Back
  </button>
  <h2 class="page-header__title">{{dictionary?.title}}</h2>
</div>

<form [formGroup]="searchForm" class="search-form">
  <div class="search-form-filters">
    <mat-form-field class="search-form__filter">
      <mat-label>Word</mat-label>
      <input
        matInput
        (keyup)="applyFilter()"
        formControlName="wordInput"
        placeholder="Word"
        type="text"
      >
    </mat-form-field>
    <mat-form-field class="search-form__filter">
      <mat-label>Translate</mat-label>
      <input
        matInput
        (keyup)="applyFilter()"
        formControlName="translateInput"
        placeholder="Translate"
        type="text"
      >
    </mat-form-field>
  </div>
  <div class="search-form-controls">
    <button
      mat-raised-button
      class="search-form__button"
      (click)="refreshData()"
    >
      <mat-icon>refresh</mat-icon>
      Refresh Data
    </button>
    <button
      mat-raised-button
      color="primary"
      class="search-form__button"
      (click)="openCreateWordPopup()"
    >
      <mat-icon>add</mat-icon>
      Add Word
    </button>
  </div>
</form>
<div class="mat-elevation-z8">
  <div *ngIf="isLoading" class="spinner">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
  </div>
  <div class="table" [hidden]="isLoading">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{row.id}}</td>
      </ng-container>

      <ng-container matColumnDef="word">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Word</th>
        <td mat-cell *matCellDef="let row">{{row.word}}</td>
      </ng-container>

      <ng-container matColumnDef="translate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Translate</th>
        <td mat-cell *matCellDef="let row">{{row.translate}}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
        <td mat-cell *matCellDef="let row">{{row.createdAt | date}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="openEditWordPopup(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="openDeleteWordPopup(row.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr *matNoDataRow>
        <td class="empty-cell" colspan="5">Words not found</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="paginationOptions" aria-label="Select page of dictionary words"></mat-paginator>
  </div>
</div>
