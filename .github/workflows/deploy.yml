name: Deploy
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin master
            docker compose up -d --build

            curl -fsSL \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
              -o /tmp/dictionaries.prod.json \
              "${{ secrets.DICTIONARIES_DATA_URL }}"

            docker compose cp /tmp/dictionaries.prod.json backend:/tmp/dictionaries.prod.json
            docker compose exec -T backend node seed-prod-dictionaries.js /tmp/dictionaries.prod.json
            rm -f /tmp/dictionaries.prod.json
            docker compose exec -T backend rm -f /tmp/dictionaries.prod.json

            docker image prune -f
            docker builder prune -f --filter "until=24h"
